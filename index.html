<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>祭司祈禱計時器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500;700&family=Share+Tech+Mono&display=swap">
<style>
*{box-sizing:border-box} body{margin:0} [hidden]{display:none!important}

/* Layout: single centered altar column — role switch, then a stone tablet holding the countdown, then the ID seal. Deliberately one dark look. */
:root {
  --night: #0f1216;
  --stone: #191e24;
  --stone-2: #232a32;
  --line: #333c46;
  --ink: #e9e4d8;
  --muted: #8f978f;
  --gold: #d9b45a;
  --gold-deep: #a7832f;
  --warn: #f0a63c;
  --alert: #ef5b4c;
  --ok: #6cc3a0;
  --f-display: "Noto Serif TC", "Songti TC", serif;
  --f-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --f-digit: "Share Tech Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
html, body { min-height: 100%; }
body {
  background: radial-gradient(120% 60% at 50% 0%, #1b2129 0%, var(--night) 60%) fixed, var(--night);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 15px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 40px;
}
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
header { display: flex; flex-direction: column; gap: 4px; }
h1 { font-family: var(--f-display); font-weight: 900; font-size: 26px; margin: 0; letter-spacing: .06em; text-wrap: balance; }
.sub { color: var(--muted); font-size: 13px; margin: 0; }

.roles { display: grid; grid-template-columns: 1fr 1fr; gap: 0; border: 1px solid var(--line); border-radius: 12px; padding: 4px; background: var(--stone); }
.roles button {
  font: 700 16px var(--f-body); color: var(--muted); background: transparent; border: 0; border-radius: 9px;
  padding: 12px 8px; cursor: pointer; letter-spacing: .08em;
}
.roles button[aria-pressed="true"] { background: var(--gold); color: #1b1608; }
.roles button:focus-visible, .btn:focus-visible, input:focus-visible, .chip:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

.panel { display: flex; flex-direction: column; gap: 16px; }
.btn {
  font: 700 18px var(--f-body); letter-spacing: .12em; cursor: pointer;
  border-radius: 12px; padding: 16px; border: 1px solid var(--gold-deep);
  background: linear-gradient(180deg, #e6c26a, var(--gold)); color: #1b1608;
}
.btn:active { transform: translateY(1px); }
.btn.ghost { background: transparent; color: var(--gold); font-size: 15px; padding: 12px; }
.btn:disabled { opacity: .5; cursor: default; }

.join { display: grid; grid-template-columns: 1fr auto; gap: 10px; }
.join label { grid-column: 1 / -1; font-size: 13px; color: var(--muted); letter-spacing: .08em; }
input#hitId {
  min-width: 0; font: 400 26px var(--f-digit); letter-spacing: .25em; text-align: center;
  background: var(--stone); color: var(--ink); border: 1px solid var(--line); border-radius: 12px; padding: 12px;
}
.join .btn { padding: 12px 22px; font-size: 16px; }

/* The tablet */
.tablet {
  position: relative; border: 1px solid var(--line); border-radius: 18px; background: var(--stone);
  padding: 26px 16px 22px; display: flex; flex-direction: column; align-items: center; gap: 14px; overflow: hidden;
}
.tablet::before { content: ""; position: absolute; inset: 8px; border: 1px solid #2b333c; border-radius: 12px; pointer-events: none; }
.phase { font-size: 12px; letter-spacing: .3em; color: var(--muted); text-transform: uppercase; }
.clock {
  font-family: var(--f-digit); font-variant-numeric: tabular-nums; line-height: 1;
  font-size: clamp(48px, 15vw, 92px); letter-spacing: .02em; color: var(--ink); white-space: nowrap;
  transition: color .2s;
}
.clock .ms { font-size: .55em; color: var(--muted); }
.clock.warn { color: var(--warn); }
.clock.alert { color: var(--alert); }
.tablet.flash { animation: flash .35s ease-out; }
@keyframes flash { from { box-shadow: inset 0 0 0 999px rgba(239,91,76,.22); } to { box-shadow: inset 0 0 0 999px rgba(239,91,76,0); } }
.bar { width: 100%; height: 6px; border-radius: 6px; background: var(--stone-2); overflow: hidden; position: relative; }
.bar i { position: absolute; inset: 0 auto 0 0; background: var(--gold); width: 100%; }
.bar .m30, .bar .m15 { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--night); }
.bar .m30 { left: 25%; } .bar .m15 { left: 12.5%; }
.meta { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; color: var(--muted); font-size: 13px; }
.meta b { color: var(--ink); font-weight: 500; font-variant-numeric: tabular-nums; }

.seal { display: flex; flex-direction: column; align-items: center; gap: 8px; padding-top: 4px; }
.seal .lbl { font-size: 12px; letter-spacing: .3em; color: var(--muted); }
.seal .id { font: 400 44px var(--f-digit); letter-spacing: .2em; color: var(--gold); padding-left: .2em; }
.chip { font: 500 13px var(--f-body); color: var(--ink); background: var(--stone-2); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; cursor: pointer; }

.status { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; min-height: 20px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--alert); }
.status.err { color: var(--alert); }

.rules { border-top: 1px solid var(--line); padding-top: 16px; color: var(--muted); font-size: 13px; line-height: 1.7; }
.rules h2 { font: 600 14px var(--f-display); color: var(--ink); margin: 0 0 6px; letter-spacing: .1em; }
.rules ul { margin: 0; padding-left: 1.2em; }
.toolbar { display: flex; justify-content: flex-end; gap: 8px; }
@media (prefers-reduced-motion: reduce) { .tablet.flash { animation: none; } .clock { transition: none; } }
</style>
</head>
<body>


<div class="wrap">
  <header>
    <h1>祭司祈禱計時器</h1>
    <p class="sub">網路校時，所有人同一刻聽到同一聲逼。</p>
  </header>

  <div class="roles" role="group" aria-label="選擇身分">
    <button id="rolePriest" type="button" aria-pressed="true">我是祭司</button>
    <button id="roleHitter" type="button" aria-pressed="false">我是打手</button>
  </div>

  <section class="panel" id="priestPanel">
    <button class="btn" id="startBtn" type="button">開始祈禱</button>
  </section>

  <section class="panel" id="hitterPanel" hidden>
    <form class="join" id="joinForm">
      <label for="hitId">輸入祭司的 ID</label>
      <input id="hitId" inputmode="numeric" autocomplete="off" maxlength="7" placeholder="0000000" pattern="[0-9]{7}">
      <button class="btn" id="joinBtn" type="submit">同步</button>
    </form>
  </section>

  <section class="tablet" id="tablet" aria-live="off">
    <div class="phase" id="phase">等待開始</div>
    <div class="clock" id="clock">02:00<span class="ms">:000</span></div>
    <div class="bar" aria-hidden="true"><i id="barFill"></i><span class="m30"></span><span class="m15"></span></div>
    <div class="meta">
      <span>第 <b id="round">–</b> 輪</span>
      <span>校時誤差 <b id="drift">–</b></span>
    </div>
    <div class="seal" id="seal" hidden>
      <span class="lbl">計時器 ID</span>
      <span class="id" id="sealId">——</span>
      <button class="chip" id="copyBtn" type="button">複製 ID</button>
    </div>
  </section>

  <div class="status" id="status"><span class="dot" id="dot"></span><span id="statusText">正在向網路校時…</span></div>

  <div class="toolbar">
    <button class="chip" id="muteBtn" type="button" aria-pressed="false">聲音：開</button>
    <button class="chip" id="testBtn" type="button">試聽逼聲</button>
  </div>

  <section class="rules">
    <h2>計時規則</h2>
    <ul>
      <li>每輪 2 分鐘，歸零後立即開始下一輪，不停頓。</li>
      <li>剩 30 秒：一聲提示逼。</li>
      <li>剩 15 秒起：急促逼聲，越來越快直到 0 秒。</li>
      <li>ID 就是祭司按下開始那一刻的網路時間戳（取末 7 位）。打手輸入後，各自用網路時間算出同一個倒數，不需要連線到祭司。</li>
      <li>祭司按「重新開始祈禱」會產生新的 ID，打手需輸入新 ID。</li>
    </ul>
  </section>
</div>


<script>
(() => {
  const ROUND = 120000;
  // ID = network-time start timestamp (ms) folded into a 7-digit window.
  // The window is an exact multiple of one round (83 × 2 min ≈ 2 h 46 min),
  // so the countdown phase decoded from an ID is always exact.
  const ID_SPAN = ROUND * 83;              // 9,960,000 ms
  const RELAY = "https://ntfy.sh/";        // used only as a last-resort time source
  const TOPIC_PREFIX = "prayer-timer-v1-";
  const $ = (id) => document.getElementById(id);
  const ls = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };

  let role = ls.get("pt.role") === "hitter" ? "hitter" : "priest";
  let offsetMs = 0, offsetErr = null, timeSource = "本機", synced = false;
  let startAt = null, muted = false;
  const serverNow = () => Date.now() + offsetMs;

  const encodeId = (t) => String(((t % ID_SPAN) + ID_SPAN) % ID_SPAN).padStart(7, "0");
  // Most recent start time whose last 7 digits match the ID (allow 10 s ahead for clock error).
  function decodeId(id) {
    const v = parseInt(id, 10);
    const now = serverNow() + 10000;
    return now - (((now - v) % ID_SPAN) + ID_SPAN) % ID_SPAN;
  }

  function setStatus(text, kind) {
    $("statusText").textContent = text;
    $("dot").className = "dot " + (kind || "");
    $("status").classList.toggle("err", kind === "bad");
  }

  // ---------- network time ----------
  // Every source is a public endpoint that allows cross-site reads (CORS); tried in order.
  const timeDiag = [];
  function withTimeout(ms) { const c = new AbortController(); setTimeout(() => c.abort(), ms); return c.signal; }
  async function timed(url, parse) {
    const t0 = Date.now(), p0 = performance.now();
    const r = await fetch(url, { cache: "no-store", signal: withTimeout(3000) });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const body = await r.text();
    const rtt = performance.now() - p0;
    const s = parse(body);
    if (!isFinite(s)) throw new Error("格式不符");
    return { s, t0, rtt };
  }
  const SOURCES = [
    ["Akamai", () => timed("https://time.akamai.com/?iso&ms&_=" + Math.random(), (b) => Date.parse(b.trim()))],
    ["TimeAPI", () => timed("https://timeapi.io/api/time/current/zone?timeZone=UTC", (b) => {
      const j = JSON.parse(b); return Date.parse(String(j.dateTime).slice(0, 23) + "Z"); })],
    ["WorldTimeAPI", () => timed("https://worldtimeapi.org/api/timezone/Etc/UTC", (b) => Date.parse(JSON.parse(b).utc_datetime))],
    ["Cloudflare", () => timed("https://www.cloudflare.com/cdn-cgi/trace?_=" + Math.random(), (b) => {
      const m = /(?:^|\n)ts=([\d.]+)/.exec(b); return m ? parseFloat(m[1]) * 1000 : NaN; })],
  ];
  // Fallback: the sync relay itself. Its timestamps are whole seconds, so narrow the window over several samples.
  async function syncFromRelay(n) {
    let lo = -Infinity, hi = Infinity, got = 0;
    for (let i = 0; i < n; i++) {
      const ctl = new AbortController(); setTimeout(() => ctl.abort(), 4000);
      const t0 = Date.now();
      try {
        const r = await fetch(RELAY + TOPIC_PREFIX + "clock/json?_=" + Math.random(), { signal: ctl.signal, cache: "no-store" });
        const reader = r.body.getReader(); let buf = "";
        while (!buf.includes("\n")) { const { value, done } = await reader.read(); if (done) break; buf += new TextDecoder().decode(value); }
        const t1 = Date.now(); ctl.abort();
        const ev = JSON.parse(buf.split("\n")[0]);
        const s = ev.time * 1000;
        const a = s - t1, b = s + 1000 - t0;
        if (Math.max(lo, a) <= Math.min(hi, b)) { lo = Math.max(lo, a); hi = Math.min(hi, b); } else { lo = a; hi = b; }
        got++;
      } catch (e) { if (!got && i === 0) { timeDiag.push("ntfy: " + errText(e)); return false; } }
      await new Promise((res) => setTimeout(res, 170 + (i * 317) % 830));  // land on different sub-second phases
    }
    if (!got) return false;
    offsetMs = Math.round((lo + hi) / 2); offsetErr = Math.round((hi - lo) / 2);
    return true;
  }
  function errText(e) {
    if (e && e.name === "AbortError") return "逾時";
    if (e instanceof TypeError) return "被瀏覽器或網路擋下";
    return (e && e.message) || "失敗";
  }
  async function syncClock(n) {
    timeDiag.length = 0;
    for (const [name, fn] of SOURCES) {
      let best = null;
      for (let i = 0; i < n; i++) {
        try { const x = await fn(); if (!best || x.rtt < best.rtt) best = x; }
        catch (e) { if (!best) { timeDiag.push(name + ": " + errText(e)); break; } }
      }
      if (best) {
        offsetMs = Math.round(best.s + 0.5 - (best.t0 + best.rtt / 2));
        offsetErr = Math.max(1, Math.round(best.rtt / 2));
        timeSource = name;
        $("drift").textContent = "±" + offsetErr + " ms";
        return true;
      }
    }
    if (await syncFromRelay(8)) {
      timeSource = "ntfy";
      $("drift").textContent = "±" + offsetErr + " ms";
      return true;
    }
    return false;
  }
  // ---------- audio ----------
  let ac = null;
  const scheduled = new Set();
  function ensureAudio() {
    if (!ac) { const C = window.AudioContext || window.webkitAudioContext; if (C) ac = new C(); }
    if (ac && ac.state === "suspended") ac.resume();
  }
  function beepAt(when, freq, dur, vol) {
    if (!ac || muted) return;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = "square"; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, when);
    g.gain.exponentialRampToValueAtTime(vol, when + 0.005);
    g.gain.setValueAtTime(vol, when + dur - 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
    o.connect(g).connect(ac.destination);
    o.start(when); o.stop(when + dur + 0.02);
  }
  // Beeps inside one round, as ms elapsed since the round began.
  const PATTERN = (() => {
    const out = [{ at: ROUND - 30000, f: 880, d: 0.35, v: 0.22 }];
    let rem = 15000;
    while (rem > 60) {
      out.push({ at: ROUND - rem, f: 1320, d: Math.min(0.09, 0.03 + rem / 15000 * 0.06), v: 0.2 });
      rem -= 110 + 890 * Math.pow(rem / 15000, 1.25);   // 1000 ms → ~110 ms
    }
    out.push({ at: ROUND, f: 660, d: 0.5, v: 0.25 });  // 0 秒 = next round starts
    return out;
  })();
  function scheduleAudio() {
    if (!ac || startAt == null || ac.state !== "running") return;
    const now = serverNow(), horizon = now + 2500;
    const base = Math.floor((now - startAt) / ROUND);
    for (let r = Math.max(0, base); r <= base + 1; r++) {
      const rs = startAt + r * ROUND;
      PATTERN.forEach((p, i) => {
        const t = rs + p.at;
        if (t < now - 5 || t > horizon) return;
        const key = startAt + ":" + r + ":" + i;
        if (scheduled.has(key)) return;
        scheduled.add(key);
        beepAt(Math.max(ac.currentTime, ac.currentTime + (t - now) / 1000), p.f, p.d, p.v);
      });
    }
    if (scheduled.size > 2000) scheduled.clear();
  }
  setInterval(scheduleAudio, 100);

  $("muteBtn").onclick = () => {
    muted = !muted;
    $("muteBtn").textContent = muted ? "聲音：關" : "聲音：開";
    $("muteBtn").setAttribute("aria-pressed", muted);
    if (!muted) { ensureAudio(); scheduled.clear(); }
  };
  $("testBtn").onclick = () => {
    ensureAudio(); if (!ac) return;
    const t = ac.currentTime + 0.05;
    beepAt(t, 880, 0.3, 0.22);
    for (let k = 0; k < 6; k++) beepAt(t + 0.6 + k * (0.35 - k * 0.04), 1320, 0.06, 0.2);
  };

  // ---------- rendering ----------
  const pad = (n, w) => String(n).padStart(w, "0");
  let lastBucket = null;
  function renderClock(rem) {
    const m = Math.floor(rem / 60000), s = Math.floor(rem % 60000 / 1000), ms = Math.floor(rem % 1000);
    $("clock").firstChild.nodeValue = pad(m, 2) + ":" + pad(s, 2);
    $("clock").lastChild.textContent = ":" + pad(ms, 3);
  }
  function frame() {
    if (startAt != null) {
      const el = Math.max(0, serverNow() - startAt);
      const round = Math.floor(el / ROUND);
      const rem = ROUND - (el - round * ROUND);
      renderClock(rem);
      $("round").textContent = round + 1;
      $("barFill").style.width = (rem / ROUND * 100).toFixed(2) + "%";
      $("clock").className = "clock " + (rem <= 15000 ? "alert" : rem <= 30000 ? "warn" : "");
      $("phase").textContent = rem <= 15000 ? "準備！" : rem <= 30000 ? "剩 30 秒" : "祈禱中";
      const bucket = round + ":" + (rem <= 15000 ? 15 : rem <= 30000 ? 30 : 0);
      if (bucket !== lastBucket) {
        if (lastBucket !== null && !bucket.endsWith(":0")) {
          const tb = $("tablet"); tb.classList.remove("flash"); void tb.offsetWidth; tb.classList.add("flash");
        }
        lastBucket = bucket;
      }
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  function setStart(t) {
    if (t === startAt) return;
    startAt = t; scheduled.clear(); lastBucket = null;
    scheduleAudio();
  }
  function resetView() {
    startAt = null;
    $("seal").hidden = true;
    $("startBtn").textContent = "開始祈禱";
    $("phase").textContent = "等待開始";
    $("round").textContent = "–";
    $("clock").className = "clock";
    renderClock(ROUND);
    $("barFill").style.width = "100%";
  }

  // ---------- wake lock ----------
  let wake = null;
  async function keepAwake() {
    try { if ("wakeLock" in navigator && !wake) { wake = await navigator.wakeLock.request("screen"); wake.addEventListener("release", () => { wake = null; }); } } catch {}
  }
  document.addEventListener("visibilitychange", () => { if (!document.hidden && startAt != null) { keepAwake(); ensureAudio(); } });


  // ---------- role switch ----------
  function showId(id) { $("seal").hidden = false; $("sealId").textContent = id; }
  function applyRole() {
    $("rolePriest").setAttribute("aria-pressed", role === "priest");
    $("roleHitter").setAttribute("aria-pressed", role === "hitter");
    $("priestPanel").hidden = role !== "priest";
    $("hitterPanel").hidden = role !== "hitter";
    ls.set("pt.role", role);
    resetView();
    if (role === "priest") {
      const t = Number(ls.get("pt.priestStart"));
      if (t > 0) { setStart(t); showId(encodeId(t)); $("startBtn").textContent = "重新開始祈禱"; }
    } else {
      const last = ls.get("pt.hitId");
      if (last) $("hitId").value = last;
    }
  }
  $("rolePriest").onclick = () => { if (role !== "priest") { role = "priest"; applyRole(); } };
  $("roleHitter").onclick = () => { if (role !== "hitter") { role = "hitter"; applyRole(); } };

  // ---------- priest: no network call, starts this frame ----------
  $("startBtn").onclick = () => {
    ensureAudio(); keepAwake();
    const t = Math.round(serverNow());
    setStart(t);
    ls.set("pt.priestStart", String(t));
    showId(encodeId(t));
    $("startBtn").textContent = "重新開始祈禱";
    setStatus(synced
      ? "祈禱中，把 ID 告訴打手（重新開始會換新 ID）"
      : "注意：尚未取得網路時間，這組 ID 用的是本機時間，打手可能對不準", synced ? "ok" : "warn");
  };

  // ---------- hitter: ID → start time, computed locally ----------
  let hitterId = null;
  function joinWith(id) {
    hitterId = id;
    setStart(decodeId(id));
    showId(id);
    setStatus(synced ? "已同步祭司 " + id + "（校時來源 " + timeSource + "）"
                     : "已套用 ID " + id + "，但尚未取得網路時間，可能有誤差", synced ? "ok" : "warn");
  }
  $("joinForm").addEventListener("submit", (ev) => {
    ev.preventDefault();
    ensureAudio(); keepAwake();
    const id = $("hitId").value.replace(/\D/g, "");
    if (id.length !== 7) { setStatus("ID 是 7 位數字", "bad"); return; }
    ls.set("pt.hitId", id);
    joinWith(id);
  });

  $("copyBtn").onclick = () => {
    const txt = $("sealId").textContent;
    const done = () => { $("copyBtn").textContent = "已複製"; setTimeout(() => $("copyBtn").textContent = "複製 ID", 1500); };
    const sel = () => { const r = document.createRange(); r.selectNodeContents($("sealId")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); };
    try { navigator.clipboard.writeText(txt).then(done, sel); } catch { sel(); }
  };

  // ---------- boot ----------
  applyRole();
  setStatus("正在向網路校時…", "warn");
  function afterSync(ok) {
    synced = synced || ok;
    if (!ok) {
      if (!synced) { $("drift").textContent = "未校時"; setStatus("無法取得網路時間，暫用本機時間（" + timeDiag.join("；") + "）", "warn"); }
      return;
    }
    if (role === "hitter" && hitterId) joinWith(hitterId);        // re-decode with corrected clock
    else if (startAt == null) setStatus("已校時（" + timeSource + "）" + (role === "priest" ? "，按「開始祈禱」開始" : "，輸入祭司的 ID"), "ok");
  }
  syncClock(5).then(afterSync);
  setInterval(() => syncClock(3).then(afterSync), 5 * 60 * 1000);
})();
</script>
